<header class="syp-mobilebar">
  <div class="syp-mobilebar__id">
    <span class="syp-mobilebar__mark" aria-hidden="true">SP</span>
    <span class="syp-mobilebar__title">{{ title }}</span>
  </div>

  <button
    type="button"
    class="syp-mobilebar__action"
    (click)="signOut()"
    aria-label="Sign out"
    title="Sign out"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  </button>
</header>
