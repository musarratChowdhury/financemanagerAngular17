<nav class="syp-tabbar" aria-label="Primary">
  <a
    class="syp-tabbar__item"
    [routerLink]="tabs[0].link"
    routerLinkActive="is-active"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path [attr.d]="tabs[0].path"></path>
    </svg>
    <span>{{ tabs[0].label }}</span>
  </a>

  <a
    class="syp-tabbar__item"
    [routerLink]="tabs[1].link"
    routerLinkActive="is-active"
  >

      width="22"

      <path [attr.d]="tabs[1].path"></path>
    </svg>
    <span>{{ tabs[1].label }}</span>
  </a>

  <a
    class="syp-tabbar__fab"
    routerLink="/scan-receipt"
    routerLinkActive="is-active"
    aria-label="Scan receipt"
  >
    <svg
      width="26"
      height="26"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
      <circle cx="12" cy="13" r="4"></circle>
    </svg>
  </a>

  <a
    class="syp-tabbar__item"

    <span>{{ tabs[2].label }}</span>
  </a>

  <a

  >

    <span>{{ tabs[3].label }}</span>
  </a>
</nav>
